<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Intervention Console — At-Risk Student Platform</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <!-- ===================== SIDEBAR ===================== -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">IC</div>
      <div class="brand-text">
        <div class="brand-title">Intervention Console</div>
        <div class="brand-sub">At-Risk Student Platform</div>
      </div>
    </div>

    <div class="teacher-id-field">
      <label for="teacherIdInput">Teacher ID <span title="Optional. Used to save and reload this teacher's assistant chat history. It is not a login.">ⓘ</span></label>
      <input type="text" id="teacherIdInput" placeholder="e.g. your name or staff ID" autocomplete="off">
    </div>

    <nav class="nav" id="nav">
      <div class="nav-group-label">Overview</div>
      <button class="nav-item active" data-page="overview">
        <span class="nav-icon">&#9679;</span> Pipeline Overview
      </button>

      <div class="nav-group-label">Sprint 2 — Marks Analytics</div>
      <button class="nav-item" data-page="sprint2">
        <span class="nav-icon">&#128202;</span> Class &amp; Student Reports
      </button>

      <div class="nav-group-label">Sprint 3 — Risk Prediction</div>
      <button class="nav-item" data-page="sprint3">
        <span class="nav-icon">&#129504;</span> Risk &amp; Engagement Models
      </button>

      <div class="nav-group-label">Sprint 4 — Explanation</div>
      <button class="nav-item" data-page="chat">
        <span class="nav-icon">&#128172;</span> Ask the Assistant
      </button>

      <div class="nav-group-label">Sprint 5 — Intervention Agent</div>
      <button class="nav-item" data-page="run">
        <span class="nav-icon">&#9656;</span> Run — Single Student
      </button>
      <button class="nav-item" data-page="batch">
        <span class="nav-icon">&#9638;</span> Run — Cohort Batch
      </button>
      <button class="nav-item" data-page="audit">
        <span class="nav-icon">&#128196;</span> Audit Log
      </button>
      <button class="nav-item" data-page="dashboard">
        <span class="nav-icon">&#128200;</span> Teacher Dashboard
      </button>

      <div class="nav-group-label">Settings</div>
      <button class="nav-item" data-page="settings">
        <span class="nav-icon">&#9881;</span> Connection
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="health-pill" id="healthPill">
        <span class="dot" id="healthDot"></span>
        <span id="healthText">checking backend…</span>
      </div>
    </div>
  </aside>

  <!-- ===================== MAIN ===================== -->
  <main class="main">

    <header class="topbar">
      <div class="topbar-title" id="pageTitle">Pipeline Overview</div>
      <div class="topbar-right">
        <span class="api-chip" id="apiChip">—</span>
      </div>
    </header>

    <div class="page-scroll" id="pageRoot">
      <!-- pages injected by js/app.js -->
    </div>

  </main>
</div>

<!-- toast -->
<div id="toast" class="toast"></div>

<script src="js/api.js"></script>
<script src="js/toast.js"></script>
<script src="js/charts.js"></script>
<script src="js/pages.js"></script>
<script src="js/reportEngine.js"></script>
<script src="js/sprint2Config.js"></script>
<script src="js/sprint3Config.js"></script>
<script src="js/assistant.js"></script>
<script src="js/app.js"></script>
</body>
</html>
